<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WISHLIST ⚽ - Pro Manager</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👕</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #000000; color: #e5e7eb; }
        .hidden { display: none !important; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #39FF14; }

        .text-neon { color: #39FF14; text-shadow: 0 0 5px rgba(57, 255, 20, 0.5); }
        .border-neon { border-color: #39FF14; box-shadow: 0 0 8px rgba(57, 255, 20, 0.3); }
        .hover-neon:hover { border-color: #39FF14; box-shadow: 0 0 12px rgba(57, 255, 20, 0.6); }
        .bg-neon-dim { background-color: rgba(57, 255, 20, 0.1); }
        
        .dragging { opacity: 0.3; transform: scale(0.95); transition: transform 0.2s; }
        .drag-over { border-color: #39FF14 !important; box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.6) !important; transform: scale(0.98); }
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing !important; }
        
        .sidebar-drag-over { background-color: rgba(57, 255, 20, 0.2) !important; border-right: 4px solid #39FF14; }

        .selected-card { border-color: #39FF14 !important; box-shadow: 0 0 15px rgba(57, 255, 20, 0.5); transform: scale(0.97); }
        .selected-card::after { content: '✓'; position: absolute; top: 10px; right: 10px; background: #39FF14; color: black; font-weight: bold; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; z-index: 30; }
        
        .section-drop-active { background-color: rgba(57, 255, 20, 0.05); border: 2px dashed #39FF14; border-radius: 1rem; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col md:flex-row selection:bg-[#39FF14] selection:text-black">

    <div id="image-modal" class="fixed inset-0 bg-black/95 hidden z-[100] flex items-start sm:items-center justify-center p-4 backdrop-blur-sm transition-opacity" onclick="closeModal()">
        <button class="fixed top-6 right-6 text-[#39FF14] hover:text-white text-4xl font-bold cursor-pointer z-[120]">&times;</button>

        <div class="flex flex-col items-center gap-6 max-h-[92vh] overflow-y-auto py-6 px-2">
            <div class="relative shrink-0">
                <img id="modal-img" class="max-h-[65vh] max-w-[90vw] object-contain border border-[#39FF14] shadow-[0_0_30px_rgba(57,255,20,0.2)] rounded-lg" />
                <div id="modal-customization" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/90 border border-[#39FF14] text-center px-4 py-2 rounded-lg font-mono text-sm hidden shadow-[0_0_15px_rgba(0,0,0,0.8)]"></div>
                <button id="modal-nav-prev" onclick="navModal(-1, event)" title="Imagen anterior de este producto" class="absolute left-2 top-1/2 -translate-y-1/2 z-20 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-black/70 border border-[#39FF14]/70 text-[#39FF14] text-2xl sm:text-3xl flex items-center justify-center hover:bg-[#39FF14] hover:text-black transition-all shadow-[0_0_15px_rgba(0,0,0,0.6)]">‹</button>
                <button id="modal-nav-next" onclick="navModal(1, event)" title="Imagen siguiente de este producto" class="absolute right-2 top-1/2 -translate-y-1/2 z-20 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-black/70 border border-[#39FF14]/70 text-[#39FF14] text-2xl sm:text-3xl flex items-center justify-center hover:bg-[#39FF14] hover:text-black transition-all shadow-[0_0_15px_rgba(0,0,0,0.6)]">›</button>
            </div>

            <div id="modal-toolbar" class="flex flex-wrap justify-center gap-4 sm:gap-6" onclick="event.stopPropagation()">
                <button id="modal-copy-btn" onclick="copyModalImage(event)" class="px-4 sm:px-5 py-2.5 rounded-lg font-mono text-xs sm:text-sm font-bold uppercase tracking-wider cursor-pointer transition-all backdrop-blur-sm bg-black/80 border border-[#39FF14] text-[#39FF14] hover:bg-[#39FF14] hover:text-black shadow-[0_0_15px_rgba(57,255,20,0.3)]">📋 Copiar</button>
                <button id="modal-obtained-btn" onclick="markAsObtained(event)" class="px-4 sm:px-5 py-2.5 rounded-lg font-mono text-xs sm:text-sm font-bold uppercase tracking-wider cursor-pointer transition-all backdrop-blur-sm bg-black/80 border border-amber-400 text-amber-400 hover:bg-amber-400 hover:text-black shadow-[0_0_15px_rgba(251,191,36,0.3)]">✅ Conseguida</button>
            </div>

            <div id="modal-related" class="w-[92vw] max-w-3xl hidden mt-2 mb-4 rounded-xl transition-all" onclick="event.stopPropagation()"></div>
        </div>
    </div>

    <div id="custom-input-modal" class="fixed inset-0 bg-black/90 hidden z-[200] flex items-center justify-center p-4 backdrop-blur-md transition-opacity">
        <div class="bg-[#0a0a0a] border border-[#39FF14] p-6 rounded-lg shadow-[0_0_30px_rgba(57,255,20,0.3)] w-full max-w-sm transform scale-100 transition-all">
            <h3 id="custom-input-title" class="text-lg font-black tracking-wider text-[#39FF14] mb-4 uppercase flex items-center gap-2"></h3>
            <input type="text" id="custom-input-field" class="w-full bg-black border border-zinc-700 text-white px-4 py-3 font-mono focus:outline-none focus:border-[#39FF14] focus:ring-1 focus:ring-[#39FF14] rounded-md mb-6 transition-all placeholder:text-zinc-600" autocomplete="off">
            <div class="flex justify-end gap-3">
                <button onclick="closeCustomInput()" class="px-4 py-2 text-xs font-mono text-zinc-400 hover:text-white transition-colors cursor-pointer">CANCELAR</button>
                <button onclick="saveCustomInput()" class="px-5 py-2 text-xs font-bold font-mono bg-[#39FF14] text-black rounded-md hover:bg-white transition-colors shadow-[0_0_15px_rgba(57,255,20,0.4)] cursor-pointer">GUARDAR</button>
            </div>
        </div>
    </div>

    <div id="delete-confirm-modal" class="fixed inset-0 bg-black/90 hidden z-[250] flex items-center justify-center p-4 backdrop-blur-md transition-opacity">
        <div class="bg-[#0a0a0a] border border-red-500 p-6 rounded-lg shadow-[0_0_30px_rgba(239,68,68,0.3)] w-full max-w-sm text-center transform scale-100 transition-all">
            <h3 class="text-xl font-black tracking-wider text-red-500 mb-3 uppercase flex flex-col items-center gap-2">
                <span class="text-3xl">⚠️</span> Confirmar Eliminación
            </h3>
            <p id="delete-confirm-text" class="text-zinc-400 font-mono text-sm mb-6"></p>
            <div class="flex justify-center gap-4">
                <button onclick="closeDeleteModal()" class="px-4 py-2 text-xs font-mono text-zinc-400 hover:text-white transition-colors cursor-pointer">CANCELAR</button>
                <button id="delete-confirm-btn" class="px-5 py-2 text-xs font-bold font-mono bg-red-600 text-white rounded-md hover:bg-red-500 transition-colors shadow-[0_0_15px_rgba(239,68,68,0.4)] cursor-pointer">ELIMINAR</button>
            </div>
        </div>
    </div>

    <div id="move-multi-modal" class="fixed inset-0 bg-black/95 hidden z-[200] flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-[#0a0a0a] border border-blue-400 p-6 rounded-lg shadow-[0_0_30px_rgba(96,165,250,0.3)] w-full max-w-md max-h-[80vh] overflow-y-auto">
            <h3 class="text-lg font-black tracking-wider text-blue-400 mb-4 uppercase">Mover a...</h3>
            <div id="move-multi-list" class="space-y-2 mb-6"></div>
            <div class="flex justify-end gap-3">
                <button onclick="closeMoveMultiModal()" class="px-4 py-2 text-xs font-mono text-zinc-400 hover:text-white transition-colors cursor-pointer">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="multi-action-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 border border-[#39FF14] px-6 py-3 rounded-full shadow-[0_0_20px_rgba(57,255,20,0.4)] z-[90] hidden items-center gap-4 transition-all">
        <span class="text-[#39FF14] font-mono text-sm font-bold"><span id="multi-count">0</span> seleccionados</span>
        <div class="h-4 w-px bg-zinc-700"></div>
        <button onclick="openMoveMultiModal()" class="text-blue-400 hover:text-blue-300 text-sm font-bold uppercase tracking-wider flex items-center gap-1 cursor-pointer">
            Mover ➔
        </button>
        <button onclick="openBatchDeleteModal()" class="text-red-400 hover:text-red-300 text-sm font-bold uppercase tracking-wider flex items-center gap-1 cursor-pointer">
            ✕ Eliminar
        </button>
    </div>

    <aside class="w-full md:w-72 bg-[#0a0a0a] p-6 border-b md:border-b-0 md:border-r border-zinc-800 flex flex-col shrink-0 md:sticky md:top-0 md:h-screen overflow-y-auto">
        <div class="mb-6 cursor-pointer group" onclick="showView('home')" title="Volver al inicio">
            <h1 class="text-3xl font-black tracking-tighter text-neon mb-1 flex items-center gap-2">
                WISHLIST ⚽
            </h1>
            <p class="text-xs text-zinc-500 font-mono tracking-widest uppercase group-hover:text-[#39FF14] transition-colors">← Inicio (Últimas Añadidas)</p>
        </div>

        <button onclick="toggleSelectMode()" id="btn-select-mode" class="mb-4 w-full py-2 border border-zinc-700 text-zinc-400 font-mono text-xs uppercase tracking-widest rounded hover:border-[#39FF14] hover:text-[#39FF14] transition-colors flex justify-center items-center gap-2 cursor-pointer">
            ☑️ Activar Selección
        </button>

        <div class="mb-8 space-y-2">
            <button onclick="downloadAllImagesZip()" class="w-full py-2 border border-[#39FF14] bg-[#39FF14]/10 text-[#39FF14] font-mono text-xs font-bold uppercase rounded hover:bg-[#39FF14] hover:text-black transition-all flex items-center justify-center gap-2 cursor-pointer shadow-[0_0_10px_rgba(57,255,20,0.2)]">
                <span>🖼️</span> Descargar Fotos (ZIP)
            </button>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="exportBackupJSON()" class="w-full py-1.5 border border-zinc-700 text-zinc-400 font-mono text-[10px] uppercase rounded hover:border-blue-400 hover:text-blue-400 transition-colors flex flex-col items-center cursor-pointer" title="Guardar copia para importar más adelante">
                    <span>💾</span>
                    <span>Copia JSON</span>
                </button>
                <label class="w-full py-1.5 border border-zinc-700 text-zinc-400 font-mono text-[10px] uppercase rounded hover:border-yellow-400 hover:text-yellow-400 transition-colors flex flex-col items-center cursor-pointer" title="Restaurar datos desde copia JSON">
                    <span>📂</span>
                    <span>Cargar JSON</span>
                    <input type="file" accept=".json" class="hidden" id="import-input" onchange="importBackupJSON(event)">
                </label>
            </div>
        </div>

        <nav id="sidebar-nav" class="space-y-8 flex-1"></nav>
    </aside>

    <main class="flex-1 p-6 md:p-10 overflow-x-hidden relative" id="main-drop-area">
        <section id="recent-section" class="mb-16 hidden">
            <div class="flex items-center gap-3 mb-6 border-b border-zinc-800 pb-3">
                <span class="text-2xl">⚡</span>
                <h2 class="text-2xl font-bold text-white tracking-wide">Últimas Añadidas</h2>
            </div>
            <div id="recent-grid" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-3"></div>
        </section>
        <div id="main-content" class="space-y-10"></div>
    </main>

    <script>
        localforage.config({ name: 'WishlistApp', storeName: 'images_db' });

        const defaultStructure = [
            {
                groupTitle: "REVENTA", groupId: "reventa",
                collections: [
                    { id: "rev-retro", name: "Retro" }, { id: "rev-player", name: "Player Version" },
                    { id: "rev-fan", name: "Fan Version" }, { id: "rev-personalizadas", name: "Personalizadas" }
                ]
            },
            {
                groupTitle: "PERSONAL", groupId: "personal",
                collections: [
                    { id: "per-camisetas", name: "Camisetas" }, { id: "per-cantantes", name: "Camisetas de cantantes" },
                    { id: "per-entreno", name: "Camisetas Entreno" }, { id: "per-retro", name: "Camisetas Retro" },
                    { id: "per-manega-llarga", name: "Camisetas Manga Larga" }, { id: "per-polos", name: "Polos" },
                    { id: "per-entrenamiento-c", name: "Conjuntos Entreno Corto" }, { id: "per-entrenamiento-l", name: "Conjuntos Entreno Largos" },
                    { id: "per-shorts", name: "Shorts" }, { id: "per-chaquetas", name: "Chaquetas/Cortavientos" },
                    { id: "per-abrigos", name: "Abrigos" }, { id: "per-otros", name: "Otros" }
                ]
            },
            {
                groupTitle: "NICHOS DROPSHIPPING", groupId: "nichos",
                collections: [
                    { id: "nichos-sakura", name: "Sakura Kits", subCols: [
                        { id: "sakura-sub-1", name: "Subcolección 1" },
                        { id: "sakura-sub-2", name: "Subcolección 2" },
                        { id: "sakura-sub-3", name: "Subcolección 3" }
                    ] },
                    { id: "nichos-brasil", name: "Brasil Kits" },
                    { id: "nichos-spain", name: "Spain Kits" }
                ]
            },
            {
                groupTitle: "CONSEGUIDAS", groupId: "conseguidas",
                collections: [
                    { id: "conseguidas-main", name: "Conseguidas" }
                ]
            }
        ];

        const CONSEGUIDAS_ID = 'conseguidas-main';

        let structure;
        try {
            structure = JSON.parse(localStorage.getItem('wishlist_structure_v2'));
            if (!structure || !Array.isArray(structure) || !structure[0].collections) structure = defaultStructure;
        } catch(e) { structure = defaultStructure; }

        // Añade bloques nuevos a estructuras ya guardadas SIN tocar el resto.
        (function ensureBlocks() {
            let changed = false;
            const addGroup = (group) => {
                if (structure.some(g => g.groupId === group.groupId)) return;
                // Insertar antes de CONSEGUIDAS si existe; si no, al final
                const idx = structure.findIndex(g => g.groupId === 'conseguidas');
                if (idx === -1) structure.push(group);
                else structure.splice(idx, 0, group);
                changed = true;
            };

            addGroup({
                groupTitle: "NICHOS DROPSHIPPING", groupId: "nichos",
                collections: [
                    { id: "nichos-sakura", name: "Sakura Kits" },
                    { id: "nichos-brasil", name: "Brasil Kits" },
                    { id: "nichos-spain", name: "Spain Kits" }
                ]
            });
            addGroup({
                groupTitle: "CONSEGUIDAS", groupId: "conseguidas",
                collections: [{ id: CONSEGUIDAS_ID, name: "Conseguidas" }]
            });

            // Sakura Kits: garantizar que tiene subcolecciones (sin tocar el resto)
            const sakura = structure.flatMap(g => g.collections).find(c => c.id === 'nichos-sakura');
            if (sakura && !Array.isArray(sakura.subCols)) {
                sakura.subCols = [
                    { id: "sakura-sub-1", name: "Subcolección 1" },
                    { id: "sakura-sub-2", name: "Subcolección 2" },
                    { id: "sakura-sub-3", name: "Subcolección 3" }
                ];
                changed = true;
            }

            if (changed) { try { localStorage.setItem('wishlist_structure_v2', JSON.stringify(structure)); } catch(e) {} }
        })();

        let db = {};
        let currentView = 'home';
        let isSelectMode = false;
        let selectedItems = new Set();
        
        let editContext = { action: null, targetId: null, extraId: null };
        let deleteContext = { mode: null, colId: null, index: null };

        let dragSrcEl = null; let dragSrcCol = null; let dragSrcIndex = null;

        // --- CARGA Y RASTREO AUTOMÁTICO DE DATOS ---
        async function loadDB() {
            try {
                let dbData = await localforage.getItem('ninjagoal_db_v3') || {};
                
                // Rastrear por si existen datos guardados en LocalStorage previo
                let legacyKeys = ['futbol_gallery_db', 'wishlist-v1', 'ninjagoal_db_v2'];
                
                legacyKeys.forEach(lk => {
                    try {
                        let raw = localStorage.getItem(lk);
                        if (raw) {
                            let parsed = JSON.parse(raw);
                            for (let key in parsed) {
                                let items = parsed[key];
                                if (Array.isArray(items)) {
                                    items.forEach(item => {
                                        let normalized = null;
                                        if (typeof item === 'string' && item.startsWith('data:image')) {
                                            normalized = { src: item, timestamp: Date.now(), nameNumber: "", patch: "" };
                                        } else if (typeof item === 'object' && item !== null && item.src) {
                                            normalized = { 
                                                src: item.src, timestamp: item.timestamp || Date.now(), 
                                                nameNumber: item.nameNumber || item.customization || "", patch: item.patch || "" 
                                            };
                                        }

                                        if (normalized) {
                                            let targetCol = key;
                                            if (!structure.some(g => g.collections.some(c => c.id === key))) {
                                                targetCol = 'per-camisetas'; // Fallback seguro
                                            }
                                            if (!dbData[targetCol]) dbData[targetCol] = [];
                                            let isDup = dbData[targetCol].some(ex => ex.src.substring(0,100) === normalized.src.substring(0,100));
                                            if (!isDup) dbData[targetCol].unshift(normalized);
                                        }
                                    });
                                }
                            }
                        }
                    } catch(e) {}
                });

                db = dbData;
                await saveDB(); 
                init(); 
            } catch(e) {
                console.error("Error cargando DB:", e);
                db = {}; init();
            }
        }

        function saveStructure() { localStorage.setItem('wishlist_structure_v2', JSON.stringify(structure)); }
        async function saveDB() { await localforage.setItem('ninjagoal_db_v3', db); updateAll(); }

        // --- DESCARGAR TODAS LAS FOTOS EN UN ARCHIVO ZIP DE FOTOS REALES (JPG/PNG) ---
        async function downloadAllImagesZip() {
            if (!window.JSZip) {
                alert("Cargando la herramienta de descarga... Inténtalo de nuevo en 2 segundos.");
                return;
            }

            let totalImages = 0;
            for (let colId in db) {
                if (db[colId] && db[colId].length > 0) totalImages += db[colId].length;
            }

            if (totalImages === 0) {
                alert("No tienes ninguna foto añadida todavía para descargar.");
                return;
            }

            const zip = new JSZip();
            const safe = (s) => s.replace(/[/\\?%*:|"<>]/g, '_');

            const zipAddItems = (folder, items) => {
                items.forEach((item, idx) => {
                    if (item && item.src && item.src.includes('base64,')) {
                        const parts = item.src.split(';base64,');
                        const mime = parts[0].replace('data:', '');
                        const ext = mime.includes('png') ? 'png' : 'jpg';
                        let extraName = "";
                        if (item.nameNumber) extraName += `_${safe(item.nameNumber)}`;
                        if (item.patch) extraName += `_parche-${safe(item.patch)}`;
                        folder.file(`foto_${idx + 1}${extraName}.${ext}`, parts[1], { base64: true });
                    }
                    // Imágenes relacionadas -> subcarpeta propia
                    if (item && Array.isArray(item.related) && item.related.length) {
                        const rf = folder.folder(`foto_${idx + 1}_relacionadas`);
                        item.related.forEach((rsrc, ri) => {
                            if (rsrc && rsrc.includes('base64,')) {
                                const rp = rsrc.split(';base64,');
                                const rext = rp[0].includes('png') ? 'png' : 'jpg';
                                rf.file(`rel_${ri + 1}.${rext}`, rp[1], { base64: true });
                            }
                        });
                    }
                });
            };

            structure.forEach(group => {
                group.collections.forEach(col => {
                    const items = db[col.id] || [];
                    if (items.length > 0) {
                        zipAddItems(zip.folder(safe(col.name)), items);
                    }
                    // Subcolecciones -> subcarpetas dentro de la colección
                    (col.subCols || []).forEach(sub => {
                        const sItems = db[sub.id] || [];
                        if (sItems.length > 0) {
                            zipAddItems(zip.folder(safe(col.name)).folder(safe(sub.name)), sItems);
                        }
                    });
                });
            });

            alert(`📦 Generando paquete ZIP con ${totalImages} imágenes reales en formato JPG/PNG...\n\nPor favor espera unos segundos mientras se prepara la descarga.`);

            try {
                const content = await zip.generateAsync({ type: "blob" });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(content);
                const fecha = new Date().toISOString().split('T')[0];
                a.download = `WISHLIST_Fotos_${fecha}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            } catch (err) {
                alert("Ocurrió un error al empaquetar las fotos en ZIP.");
                console.error(err);
            }
        }

        // --- SISTEMA DE COPIA DE SEGURIDAD JSON (PARA RESTAURAR EN LA WEB) ---
        function exportBackupJSON() {
            try {
                const dataStr = JSON.stringify(db);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const fecha = new Date().toISOString().split('T')[0];
                a.download = `wishlist_respaldo_${fecha}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                alert("Error al guardar la copia JSON.");
            }
        }

        function importBackupJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const importedDb = JSON.parse(e.target.result);
                    if(confirm('⚠️ ¿Quieres restaurar esta copia de seguridad? Se reemplazarán los datos actuales.')) {
                        db = importedDb;
                        await saveDB();
                        alert('✅ ¡Datos cargados con éxito!');
                        location.reload();
                    }
                } catch(error) {
                    alert('❌ Archivo de copia no válido.');
                }
                document.getElementById('import-input').value = "";
            };
            reader.readAsText(file);
        }

        // --- PASTE GLOBAL ---
        document.addEventListener('paste', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            // Si el visor de imagen está abierto, pegar como imagen RELACIONADA
            const imgModalOpen = !document.getElementById('image-modal').classList.contains('hidden');
            if (imgModalOpen && getModalItem()) {
                const cbItems = (e.clipboardData || e.originalEvent.clipboardData).items;
                const files = [];
                for (let k in cbItems) {
                    if (cbItems[k].kind === 'file' && cbItems[k].type.startsWith('image/')) files.push(cbItems[k].getAsFile());
                }
                if (files.length) { e.preventDefault(); addRelatedFromFiles(files); }
                return;
            }

            if (currentView === 'home') {
                alert("Debes entrar a una colección (ej: Shorts, Camisetas...) para poder pegar una imagen.");
                return;
            }
            const pasteTarget = currentView;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let foundImage = false;
            for (let index in items) {
                if (items[index].kind === 'file' && items[index].type.startsWith('image/')) {
                    handleFiles([items[index].getAsFile()], pasteTarget);
                    foundImage = true;
                }
            }
            if(foundImage) {
                const header = document.querySelector(`#sec-${currentView} h2`);
                if(header) {
                    header.classList.add('text-[#39FF14]');
                    setTimeout(() => header.classList.remove('text-[#39FF14]'), 500);
                }
            }

        window.handleDragStart = function(e, colId, index) {
            if (e.target.closest('.action-btn')) { e.preventDefault(); return; }
            dragSrcEl = e.currentTarget; dragSrcCol = colId; dragSrcIndex = index;
            e.dataTransfer.effectAllowed = 'copyMove';
            e.dataTransfer.setData('text/plain', index);
            setTimeout(() => { if (dragSrcEl) dragSrcEl.classList.add('dragging'); }, 0);
        };

        window.handleDragOver = function(e) {
            e.preventDefault(); e.dataTransfer.dropEffect = 'move';
            if (e.currentTarget !== dragSrcEl) e.currentTarget.classList.add('drag-over');
            return false;
        };

        window.handleDragLeave = function(e) { e.currentTarget.classList.remove('drag-over'); };

        window.handleDrop = function(e, targetColId, targetIndex) {
            e.stopPropagation(); e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (dragSrcEl) dragSrcEl.classList.remove('dragging');

            if (dragSrcCol === targetColId && dragSrcIndex !== targetIndex && dragSrcIndex !== null) {
                const arr = db[targetColId];
                const itemToMove = arr.splice(dragSrcIndex, 1)[0];
                arr.splice(targetIndex, 0, itemToMove);
                saveDB();
            }
            dragSrcEl = null; dragSrcCol = null; dragSrcIndex = null;
            return false;
        };

        window.handleDragEnd = function(e) {
            if (dragSrcEl) dragSrcEl.classList.remove('dragging');
            document.querySelectorAll('.image-card-draggable').forEach(el => el.classList.remove('drag-over'));
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('sidebar-drag-over'));
            dragSrcEl = null; dragSrcCol = null; dragSrcIndex = null;
        };

        window.handleSidebarDragOver = function(e, targetColId) {
            e.preventDefault(); e.dataTransfer.dropEffect = 'copyMove';
            e.currentTarget.classList.add('sidebar-drag-over');
            return false;
        };

        window.handleSidebarDragLeave = function(e) { e.currentTarget.classList.remove('sidebar-drag-over'); };

        window.handleSidebarDrop = function(e, targetColId) {
            e.stopPropagation(); e.preventDefault();
            e.currentTarget.classList.remove('sidebar-drag-over');

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files, targetColId);
                return false;
            }

            if (dragSrcCol && dragSrcCol !== targetColId && dragSrcIndex !== null) {
                const itemToMove = db[dragSrcCol].splice(dragSrcIndex, 1)[0];
                db[targetColId].unshift(itemToMove);
                saveDB();
            }

        // --- COPIAR IMAGEN AL PORTAPAPELES ---
        window.copyModalImage = async function(event) {
            if (event) event.stopPropagation();
            const btn = document.getElementById('modal-copy-btn');
            const src = document.getElementById('modal-img').src || modalContext.src;
            try {
                const blob = await (await fetch(src)).blob();
                let outBlob = blob;
                if (blob.type !== 'image/png') {
                    outBlob = await new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = () => {
                            const c = document.createElement('canvas');
                            c.width = img.naturalWidth; c.height = img.naturalHeight;
                            c.getContext('2d').drawImage(img, 0, 0);
                            c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob null')), 'image/png');
                        };
                        img.onerror = reject;
                        img.src = src;
                    });
                }
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': outBlob })]);
                btn.innerHTML = '✔ ¡Copiada!';
                setTimeout(() => { btn.innerHTML = '📋 Copiar'; }, 1600);
            } catch (err) {
                console.error('Error copiando imagen:', err);
                btn.innerHTML = '✖ No se pudo';
                setTimeout(() => { btn.innerHTML = '📋 Copiar'; }, 1600);
            }
        };

        // --- IMÁGENES RELACIONADAS ---
        function fileToResizedDataURL(file) {
            return new Promise((resolve, reject) => {
                if (!file || !file.type.startsWith('image/')) { reject(new Error('no image')); return; }
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const max = 800; let w = img.width, h = img.height;
                        if (w > h) { if (w > max) { h *= max / w; w = max; } } else { if (h > max) { w *= max / h; h = max; } }
                        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function getModalItem() {
            const { colId, index } = modalContext;
            if (colId == null || index == null || !db[colId] || !db[colId][index]) return null;
            return db[colId][index];
        }

        // Añade imágenes relacionadas desde una lista de File (subir / arrastrar / pegar)
        async function addRelatedFromFiles(fileList) {
            const item = getModalItem();
            if (!item) return 0;
            const files = [...(fileList || [])].filter(f => f && f.type && f.type.startsWith('image/'));
            if (!files.length) return 0;
            if (!Array.isArray(item.related)) item.related = [];
            let added = 0;
            for (const f of files) {
                try { item.related.push(await fileToResizedDataURL(f)); added++; } catch (e) {}
            }
            if (added) await saveDB();
            renderModalRelated();
            return added;
        }

            const track = document.getElementById('modal-related-track');

            if (track) track.querySelectorAll('img').forEach(im => im.addEventListener('load', updateRelNav, { once: true }));

        function updateRelNav() {
            const track = document.getElementById('modal-related-track');
            const overflow = !!track && track.scrollWidth > track.clientWidth + 4;
            ['rel-nav-prev', 'rel-nav-next'].forEach(id => {
                const b = document.getElementById(id);
                if (!b) return;
                b.classList.toggle('hidden', !overflow);
                b.classList.toggle('flex', overflow);
            });
        }

        // Añadir relacionadas ARRASTRANDO ficheros sobre el visor de imagen abierto
        (function wireRelatedDrop() {
            const modal = document.getElementById('image-modal');
            const box = document.getElementById('modal-related');
            if (!modal || !box) return;
            const ringOn = () => box.classList.add('ring-2', 'ring-[#39FF14]', 'ring-offset-2', 'ring-offset-black');
            const ringOff = () => box.classList.remove('ring-2', 'ring-[#39FF14]', 'ring-offset-2', 'ring-offset-black');
            const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');

            ['dragenter', 'dragover'].forEach(n => modal.addEventListener(n, e => {
                if (!getModalItem() || !hasFiles(e)) return;
                e.preventDefault(); e.stopPropagation();
                ringOn();
            }));
            modal.addEventListener('dragleave', e => { if (e.target === modal) ringOff(); });
            modal.addEventListener('drop', e => {
                if (!getModalItem() || !hasFiles(e)) return;
                e.preventDefault(); e.stopPropagation();
                ringOff();
                if (e.dataTransfer.files && e.dataTransfer.files.length) addRelatedFromFiles(e.dataTransfer.files);
            });
        })();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                if(!document.getElementById('custom-input-modal').classList.contains('hidden')) closeCustomInput();
                if(!document.getElementById('move-multi-modal').classList.contains('hidden')) closeMoveMultiModal();
                if(!document.getElementById('delete-confirm-modal').classList.contains('hidden')) closeDeleteModal();
            }
            // Flechas del teclado: pasar entre las imágenes del producto abierto
            const imgModalOpen = !document.getElementById('image-modal').classList.contains('hidden');
            if (imgModalOpen && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                navModal(e.key === 'ArrowRight' ? 1 : -1);
            }
        });

        // Dropzone para cada subcolección (columna dentro de Sakura Kits)
        function setupSubDropzone(subId) {
            const box = document.getElementById(`subsec-${subId}`);
            const dz = document.getElementById(`dropzone-${subId}`);
            if (!box) return;

            if (dz) {
                dz.addEventListener('click', () => {
                    const input = document.createElement('input');
                    input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
                    input.onchange = () => handleFiles(input.files, subId);
                    input.click();
                });
            }

            ['dragenter', 'dragover'].forEach(eName => {
                box.addEventListener(eName, e => {
                    if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); box.classList.add('section-drop-active'); }
                }, false);
            });
            ['dragleave', 'drop'].forEach(eName => {
                box.addEventListener(eName, e => {
                    if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); box.classList.remove('section-drop-active'); }
                }, false);
            });
            box.addEventListener('drop', e => {
                if (e.dataTransfer.types.includes('Files')) { e.stopPropagation(); handleFiles(e.dataTransfer.files, subId); }
            });
        }

        // --- EVENTOS DROPZONE GLOBALES ---
        function setupDropzone(colId) {
            const sec = document.getElementById(`sec-${colId}`);
            const dz = document.getElementById(`dropzone-${colId}`);
            if (!sec) return;
            
            if (dz) {
                dz.addEventListener('click', () => { 
                    const input = document.createElement('input'); 
                    input.type = 'file'; input.accept = 'image/*'; input.multiple = true; 
                    input.onchange = () => handleFiles(input.files, colId); 
                    input.click(); 
                });
            }

            ['dragenter', 'dragover'].forEach(eName => { 
                sec.addEventListener(eName, e => { 
                    if (e.dataTransfer.types.includes('Files')) {
                        e.preventDefault(); 
                        sec.classList.add('section-drop-active'); 
                    }
                }, false); 
            });
            
            ['dragleave', 'drop'].forEach(eName => { 
                sec.addEventListener(eName, e => { 
                    if (e.dataTransfer.types.includes('Files')) {
                        e.preventDefault(); 
                        sec.classList.remove('section-drop-active'); 
                    }
                }, false); 
            });
            
            sec.addEventListener('drop', e => {
                if (e.dataTransfer.types.includes('Files')) {
                    handleFiles(e.dataTransfer.files, colId);
                }
            });
        }

        function handleFiles(files, colId) {
            ([...files]).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const max = 800; let w = img.width, h = img.height;
                        if (w > h) { if (w > max) { h *= max/w; w = max; } } else { if (h > max) { w *= max/h; h = max; } }
                        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        
                        // Añadimos en primera posición
                        db[colId].unshift({ src: canvas.toDataURL('image/jpeg', 0.8), timestamp: Date.now(), nameNumber: "", patch: "" });
                        saveDB();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function updateAll() {
            let allImages = [];
            structure.forEach(group => {
                group.collections.forEach(col => {
                    const items = db[col.id] || [];

                    // Fotos sueltas ("Sin clasificar" si la colección tiene subcolecciones)
                    const grid = document.getElementById(`grid-${col.id}`);
                    if (grid) {
                        grid.innerHTML = '';
                        items.forEach((item, index) => {
                            if (item.customization && !item.nameNumber) { item.nameNumber = item.customization; delete item.customization; }
                            allImages.push({ ...item, colId: col.id, index: index });
                            grid.appendChild(createImageCard(item, col.id, index, false));
                        });
                    }

                    // Subcolecciones (columnas)
                    let total = items.length;
                    (col.subCols || []).forEach(sub => {
                        const sItems = db[sub.id] || [];
                        total += sItems.length;
                        const sCount = document.getElementById(`count-${sub.id}`);
                        if (sCount) sCount.innerText = sItems.length;
                        const sGrid = document.getElementById(`grid-${sub.id}`);
                        if (sGrid) {
                            sGrid.innerHTML = '';
                            sItems.forEach((item, index) => {
                                if (item.customization && !item.nameNumber) { item.nameNumber = item.customization; delete item.customization; }
                                allImages.push({ ...item, colId: sub.id, index: index });
                                sGrid.appendChild(createImageCard(item, sub.id, index, false));
                            });
                        }
                    });

                    const countEl = document.getElementById(`count-${col.id}`);
                    if (countEl) countEl.innerText = `${total} u.`;
                    const badge = document.getElementById(`badge-${col.id}`);
                    if (badge) {
                        badge.innerText = total;
                        if (total > 0) { badge.classList.replace('bg-zinc-900', 'bg-neon-dim'); badge.classList.replace('text-zinc-600', 'text-neon'); }
                        else { badge.classList.replace('bg-neon-dim', 'bg-zinc-900'); badge.classList.replace('text-neon', 'text-zinc-600'); }
                    }
                });
            });
            renderRecents(allImages);
        }

        function createImageCard(item, colId, index, isRecentView) {
            const div = document.createElement('div');
            
            const dragAttrs = (isRecentView || isSelectMode) ? "" : `draggable="true" ondragstart="handleDragStart(event, '${colId}', ${index})" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${colId}', ${index})" ondragend="handleDragEnd(event)"`;
            
            const isSelected = selectedItems.has(`${colId}|${index}`);
            
            div.className = `image-card-draggable relative aspect-[3/4] bg-zinc-900 rounded-md overflow-hidden border border-zinc-800 transition-all ${isRecentView ? '' : 'hover:border-[#39FF14]'} group ${isSelected ? 'selected-card' : ''}`;
            
            if (!isRecentView && !isSelectMode) {
                div.classList.add('cursor-grab', 'active:cursor-grabbing');
            } else if (isSelectMode) {
                div.classList.add('cursor-pointer');
            }

            div.onclick = (e) => { 
                if(isSelectMode) {
                    toggleSelection(colId, index, div);
                } else {
                    if(e.target.closest('.action-btn')) return;
                    openModal(item.src, item.nameNumber, item.patch, e, colId, index);
                }
            };
            
            let labelsHTML = '';
            if (item.nameNumber || item.patch) {
                labelsHTML += `<div class="absolute bottom-0 left-0 right-0 bg-black/90 border-t border-[#39FF14]/50 p-1 text-center truncate z-10 flex flex-col gap-0.5 pointer-events-none">`;
                if (item.nameNumber) labelsHTML += `<span class="text-[9px] font-mono text-[#39FF14] uppercase tracking-wider leading-tight">📝 ${item.nameNumber}</span>`;
                if (item.patch) labelsHTML += `<span class="text-[9px] font-mono text-blue-400 uppercase tracking-wider leading-tight">🛡️ ${item.patch}</span>`;
                labelsHTML += `</div>`;
            }

            const actionButtonsVisible = isSelectMode ? "hidden" : "flex";
            const relBadge = (Array.isArray(item.related) && item.related.length)
                ? `<span class="bg-black/80 text-sky-400 text-[9px] font-mono font-bold px-1.5 py-0.5 rounded pointer-events-none">🔗 ${item.related.length}</span>`
                : '';
            const favActive = !!item.fav;
            const favBtn = isSelectMode ? '' : `<button onclick="event.stopPropagation(); toggleFav('${colId}', ${index}, event)" title="Destacar"
                    class="action-btn w-7 h-7 flex items-center justify-center rounded-md text-sm leading-none transition-all ${favActive ? 'bg-black/70 opacity-100 drop-shadow-[0_0_4px_rgba(250,204,21,0.8)]' : 'bg-black/40 opacity-30 grayscale hover:opacity-90 hover:grayscale-0'}">⭐</button>`;
            const cornerTL = `<div class="absolute top-1 left-1 z-30 flex flex-col items-start gap-1">${favBtn}${relBadge}</div>`;

            div.innerHTML = `
                <div class="absolute inset-0 z-0" ${dragAttrs}></div>
                <img src="${item.src}" draggable="false" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity pointer-events-none relative z-0" alt="Producto">
                ${cornerTL}
                ${labelsHTML}
                <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 ${actionButtonsVisible} flex-col justify-between p-2 transition-opacity z-20 pointer-events-none">
                    <div class="flex justify-end w-full">
                        <span class="text-white bg-black/80 p-1.5 rounded-md text-[10px] shadow-lg pointer-events-none">🔍</span>
                    </div>
                    <div class="flex flex-col gap-1.5 items-end self-end mb-8 pointer-events-auto">
                        <button onclick="openInput('name', '${colId}', ${index}, event)" class="action-btn flex items-center justify-center w-7 h-7 bg-[#0a0a0a] border border-[#39FF14]/50 text-[#39FF14] rounded-md text-xs hover:bg-[#39FF14] hover:text-black transition-all shadow-[0_0_10px_rgba(57,255,20,0.2)]" title="Añadir/Editar Nombre y Número">📝</button>
                        <button onclick="openInput('patch', '${colId}', ${index}, event)" class="action-btn flex items-center justify-center w-7 h-7 bg-[#0a0a0a] border border-blue-400/50 text-blue-400 rounded-md text-xs hover:bg-blue-400 hover:text-black transition-all shadow-[0_0_10px_rgba(96,165,250,0.2)]" title="Añadir/Editar Parche">🛡️</button>
                        <button onclick="openDeleteModal('${colId}', ${index}, event)" class="action-btn flex items-center justify-center w-7 h-7 bg-red-900/80 border border-red-500/50 text-red-300 rounded-md text-xs hover:bg-red-500 hover:text-white transition-all mt-1" title="Eliminar">✕</button>
                    </div>
                </div>
            `;
            return div;
        }

        function renderRecents(allImages) {
            const recentSection = document.getElementById('recent-section');
            const recentGrid = document.getElementById('recent-grid');
            recentGrid.innerHTML = '';
            if (allImages.length === 0) { recentSection.classList.add('hidden'); return; }
            allImages.sort((a, b) => b.timestamp - a.timestamp);
            const top10 = allImages.slice(0, 10);
            top10.forEach(item => {
                const card = createImageCard(item, item.colId, item.index, true);
                card.classList.add('border-[#39FF14]/30'); 
                recentGrid.appendChild(card);
            });
            if (currentView === 'home') { recentSection.classList.remove('hidden'); } else { recentSection.classList.add('hidden'); }
        }

        window.onload = loadDB;
    </script>
</body>
</html>
